services:
  - type: web
    name: smart-reminder
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: BOT_TOKEN
        value: 8784820707:AAHCrpcPYvYwvFidjqq_dp6xnO2_bOJ49ks
      - key: CHAT_ID
        value: 8666034530
      - key: DATABASE_URL
        fromDatabase:
          name: smart-reminder-db
          property: connectionString

databases:
  - name: smart-reminder-db
    databaseName: reminders
    plan: free
